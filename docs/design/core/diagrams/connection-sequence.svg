<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 620" font-family="monospace" font-size="12">
  <style>
    text          { fill: #e0e0e0; }
    text.title    { font-size: 16px; font-weight: bold; }
    text.subtitle { font-size: 12px; fill: #909090; }
    text.nlabel   { font-size: 13px; font-weight: bold; }
    text.nrole    { font-size: 10px; fill: #909090; }
    text.plabel   { font-size: 13px; font-weight: bold; fill: #909090; }
    text.annot    { font-size: 10px; fill: #909090; font-style: italic; }
    text.alabel   { font-size: 11px; }
    text.caption  { font-size: 11px; fill: #707080; font-style: italic; }
    line.sep      { stroke: #303040; stroke-width: 1; stroke-dasharray: 6,4; }
    line.life     { stroke: #303040; stroke-width: 1; stroke-dasharray: 2,3; }

    .bg           { fill: #0d1117; }
    .callout      { fill: #151520; }
    .node         { fill: #2e3a5e; stroke: #5080c0; }

    @media (prefers-color-scheme: light) {
      text          { fill: #1f2328; }
      text.subtitle, text.nrole, text.plabel, text.annot, text.altlabel,
      text.elabel, text.mdesc, text.tlabel { fill: #656d76; }
      text.caption  { fill: #7c8186; }
      line.sep, line.life { stroke: #d1d9e0; }
      rect.alt      { stroke: #d1d9e0; }
      .bg           { fill: #ffffff; }
      .callout      { fill: #f6f8fa; }
      .node, rect.node { fill: #ddf4ff; stroke: #0969da; }
      rect.compute, rect.result { fill: #f6f8fa; }
    }
  </style>

  <defs>
    <marker id="aR" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0,0 7,2.5 0,5" fill="#5080c0"/>
    </marker>
    <marker id="aL" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0,0 7,2.5 0,5" fill="#d0a040"/>
    </marker>
    <marker id="aG" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0,0 7,2.5 0,5" fill="#40a060"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="620" rx="8" class="bg"/>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" class="title">Normal Connection Sequence</text>
  <text x="360" y="46" text-anchor="middle" class="subtitle">Peer already online — direct to Spilman channels</text>

  <!-- Node headers -->
  <rect x="110" y="65" width="100" height="42" class="node" stroke-width="2" rx="6"/>
  <text x="160" y="85" text-anchor="middle" class="nlabel">Peer A</text>
  <text x="160" y="98" text-anchor="middle" class="nrole">Provider</text>

  <rect x="510" y="65" width="100" height="42" class="node" stroke-width="2" rx="6"/>
  <text x="560" y="85" text-anchor="middle" class="nlabel">Peer B</text>
  <text x="560" y="98" text-anchor="middle" class="nrole">Provider</text>

  <!-- Lifelines -->
  <line x1="160" y1="107" x2="160" y2="590" class="life"/>
  <line x1="560" y1="107" x2="560" y2="590" class="life"/>

  <!-- ═══ Phase 1: Identity ═══ -->
  <text x="40" y="132" text-anchor="middle" class="plabel">1</text>
  <text x="40" y="148" text-anchor="middle" class="annot">Identity</text>

  <!-- A → B Announce -->
  <line x1="170" y1="140" x2="548" y2="140" stroke="#5080c0" stroke-width="1.5" marker-end="url(#aR)"/>
  <text x="360" y="133" text-anchor="middle" class="alabel" fill="#5080c0">Announce (v1, pubkey_A)</text>

  <!-- B → A Announce -->
  <line x1="550" y1="165" x2="172" y2="165" stroke="#d0a040" stroke-width="1.5" marker-end="url(#aL)"/>
  <text x="360" y="158" text-anchor="middle" class="alabel" fill="#d0a040">Announce (v1, pubkey_B)</text>

  <!-- separator -->
  <line x1="70" y1="185" x2="660" y2="185" class="sep"/>

  <!-- ═══ Phase 2: Pricing ═══ -->
  <text x="40" y="207" text-anchor="middle" class="plabel">2</text>
  <text x="40" y="223" text-anchor="middle" class="annot">Terms</text>

  <!-- A → B Offer -->
  <line x1="170" y1="215" x2="548" y2="215" stroke="#5080c0" stroke-width="1.5" marker-end="url(#aR)"/>
  <text x="360" y="208" text-anchor="middle" class="alabel" fill="#5080c0">Offer (mints, unit, window range, multiplier)</text>

  <!-- B → A Offer -->
  <line x1="550" y1="240" x2="172" y2="240" stroke="#d0a040" stroke-width="1.5" marker-end="url(#aL)"/>
  <text x="360" y="233" text-anchor="middle" class="alabel" fill="#d0a040">Offer (mints, unit, multiplier)</text>

  <!-- separator -->
  <line x1="70" y1="260" x2="660" y2="260" class="sep"/>

  <!-- ═══ Phase 3: Channel Setup ═══ -->
  <text x="40" y="282" text-anchor="middle" class="plabel">3</text>
  <text x="40" y="298" text-anchor="middle" class="annot">Channels</text>

  <!-- B → A Accept -->
  <line x1="550" y1="290" x2="172" y2="290" stroke="#d0a040" stroke-width="1.5" marker-end="url(#aL)"/>
  <text x="360" y="283" text-anchor="middle" class="alabel" fill="#d0a040">Accept + funding (B&#8594;A channel)</text>

  <!-- A → B Accept -->
  <line x1="170" y1="315" x2="548" y2="315" stroke="#5080c0" stroke-width="1.5" marker-end="url(#aR)"/>
  <text x="360" y="308" text-anchor="middle" class="alabel" fill="#5080c0">Accept + funding (A&#8594;B channel)</text>

  <!-- B → A ChannelReady -->
  <line x1="550" y1="345" x2="172" y2="345" stroke="#40a060" stroke-width="1.5" marker-end="url(#aG)"/>
  <text x="360" y="338" text-anchor="middle" class="alabel" fill="#40a060">ChannelReady (B&#8594;A)</text>

  <!-- A → B ChannelReady -->
  <line x1="170" y1="370" x2="548" y2="370" stroke="#40a060" stroke-width="1.5" marker-end="url(#aG)"/>
  <text x="360" y="363" text-anchor="middle" class="alabel" fill="#40a060">ChannelReady (A&#8594;B)</text>

  <!-- separator -->
  <line x1="70" y1="395" x2="660" y2="395" class="sep"/>

  <!-- ═══ Phase 4: Settlement loop ═══ -->
  <text x="40" y="417" text-anchor="middle" class="plabel">4</text>
  <text x="40" y="433" text-anchor="middle" class="annot">Buy</text>
  <text x="40" y="445" text-anchor="middle" class="annot">(each side,</text>

  <!-- loop indicator -->
  <rect x="100" y="405" width="530" height="145" rx="4" fill="none" stroke="#303040" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="625" y="418" text-anchor="start" class="annot">on its own)</text>

  <!-- A → B TopUp: A buys a rate from B -->
  <line x1="170" y1="440" x2="548" y2="440" stroke="#5080c0" stroke-width="2" marker-end="url(#aR)"/>
  <text x="360" y="433" text-anchor="middle" class="alabel" fill="#5080c0">TopUp (cumulative, window)</text>

  <!-- B → A TopUp: B buys a rate from A -->
  <line x1="550" y1="480" x2="172" y2="480" stroke="#d0a040" stroke-width="2" marker-end="url(#aL)"/>
  <text x="360" y="473" text-anchor="middle" class="alabel" fill="#d0a040">TopUp (cumulative, window)</text>

  <!-- notes -->
  <text x="360" y="510" text-anchor="middle" class="annot">no acknowledgment &#8212; cumulative state is self-correcting</text>
  <text x="360" y="530" text-anchor="middle" class="annot">each side repeats before its own deadline; the two never synchronize</text>

  <!-- Caption -->
  <text x="360" y="585" text-anchor="middle" class="caption">Both sides send Offer and Accept — each delivers independently</text>
</svg>
